# STEP 21 — window 길이 ablation. RQ 는 "win=1024(4.096 s)가 적절했는가" 다.
#
# 2x2 다 (D-14). 행 = window, 열 = 구조.
#   M06  컨볼루션 수용영역 887 샘플(3.5 s) — window 를 늘려도 그 너머를 못 본다
#   M09  전역 attention — 늘린 문맥을 실제로 쓸 수 있다
# 따라서 "긴 window 가 좋은가"(행)와 "구조가 필요한가"(교호작용)가 갈린다.
#
# 주의: 체크포인트마다 학습 window 가 다르다. dl_wrapper 가 체크포인트의
# data_win 을 따르므로 여기서 win 을 지정하지 않는다 (지정하면 오히려 어긋난다).
exp_id: abl_window
frontend: true
mode: snr

data:
  source: auto
  split: test
  seg_s: 60.0
  n_seg_per_record: 2
  snr_grid: [0, 10, 20]
  conditions: [mixed]
  noise_split: test
  dur_s: 300.0
  n_test: 22
  seed: eval_abl_win

methods: [M_FE]

dl_methods:
  M06-w1024: {ckpt: "results/{tag}/m06_l1/best.pt"}
  M06-w4096: {ckpt: "results/{tag}/m06_w4096/best.pt"}
  M09-w1024: {ckpt: "results/{tag}/m09_l1/best.pt"}
  M09-w4096: {ckpt: "results/{tag}/m09_w4096/best.pt"}

eval:
  do_morph: true          # QRS 형태 — 긴 문맥이 국소 형태를 해치는가
  do_spectral: false

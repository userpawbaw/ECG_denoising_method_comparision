exp_id: m10_l1
# M10 = downsampling 을 dilation 으로 바꾼 M06.
# **M06 과 손실(L1)·데이터·학습 일정을 전부 같게 둔다** — 그래야 차이가
# '시간 해상도 유지' 하나로 귀속된다 (F-10).
seed: 0

model:
  name: dilated_resnet1d
  kwargs: {}

loss: L1

data:
  source: auto            # auto = MIT-BIH 가 있으면 그것, 없으면 합성
  dur_s: 300.0            # 합성 소스일 때 기록 길이
  n_train: 18
  n_val: 4
  n_test: 22
  win: 1024
  hop: 512
  snr_range: [-5.0, 20.0]
  max_per_record: 160     # 에폭당 window 수 상한 (계산량 조절)
  nstdb_root: data/raw/nstdb
  frontend: true          # 공통 front-end 를 딥러닝에도 동일 적용
                          # (끄면 DL 만 기저선 제거를 처음부터 학습해야 해 불공정)

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 64
  epochs: 60
  warmup_frac: 0.05
  patience: 12
  grad_clip: 1.0

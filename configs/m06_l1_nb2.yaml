# D-28 5 번 (B) — **폭을 고정하고 깊이만 늘린다.** 파라미터가 함께 는다.
#   chs (24,32,48,64,96) 그대로 · 레벨당 ResBlock 2 개
#   params 1,266,505 (기준 976,489 대비 x1.30)
#   수용영역 1127 샘플
#
# **D-27 과 짝이다.** D-27 은 파라미터를 묶어 두고 폭을 깎아 깊이를 샀다.
# 그래서 「깊어서」와 「좁아서」가 갈리지 않았다 — 실제로 D-27 은 저 SNR 에서
# 유의하게 나빴는데(F-44) 그게 깊이 탓인지 좁아진 탓인지 모른다.
# 여기서는 폭을 건드리지 않으므로 **같은 손해가 또 나면 깊이 탓**이고,
# 사라지면 D-27 의 손해는 **좁아진 탓**이다.

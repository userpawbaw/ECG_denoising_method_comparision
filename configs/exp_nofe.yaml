# EXP-NOFE — **곁가지 실험이다. EXP-A~G 의 표에 넣지 않는다.**
#
# 묻는 것: 「앞단(front-end)을 사람이 설계해 주는 것」과 「모델이 스스로
# 배우게 두는 것」 중 무엇이 나은가.
#
# 이 비교가 성립하는 이유는 평가 세트의 구조 덕분이다 (dataset.build_eval_set):
#
#   y (입력)  = 원본 clean + 잡음        <- 두 방식이 **같은 것**을 받는다
#   x (참조)  = FE_off(clean)             <- 두 방식이 **같은 것**과 비교된다
#
# 즉 FE 는 방법 안쪽에 있고 참조·입력 어디에도 개입하지 않는다. M06 은
# 자기 안에서 FE 를 걸고, M06n 은 안 건다. **분모가 같으므로 숫자가 비교
# 가능하다.** 학습 로그의 `val snr_imp` 로 둘을 견주면 안 된다 — 그쪽은
# 입력이 서로 달라서 분모가 다르다 (F-10 의 덫).
#
# EXP-A 와 **같은 평가 세트**를 쓴다(seed·격자·조건 동일). 그래서 여기의
# M06 열은 EXP-A 의 M06 열과 같아야 하고, 다르면 무언가 어긋난 것이다.
exp_id: exp_nofe

# **주 학습 러너가 만들지 않는 체크포인트를 쓴다** — 일부러 그렇다. 기본
# RUNS 에 넣으면 축마다 30 분을 쓰고, 무엇보다 주 표에 들어갈 자격이 있는
# 것처럼 보인다. 대신 「누가 만드는가」에 답을 적어 둔다 (F-9 의 요구).
side_experiment:
  train: bash scripts/run_one_training.sh mitdb m06_l1_nofe
  train2: bash scripts/run_one_training.sh mitdb m08_l6_nofe
  train3: bash scripts/run_all_training.sh mitdb m06_l6_nofe m08_l1_nofe
frontend: true
mode: snr

data:
  source: auto
  split: test
  seg_s: 60.0
  n_seg_per_record: 2
  snr_grid: [-5, 0, 5, 10, 15, 20]
  conditions: [mixed]
  noise_split: test
  dur_s: 300.0
  n_test: 22
  seed: eval_a            # EXP-A 와 같은 세트

methods: [M00, M_FE]      # 바닥선과 «FE 만»

# **쌍으로 넣는다.** 같은 모델·손실의 FE 판과 nofe 판을 나란히 두어야
# «FE 를 뺀 대가» 가 그 쌍 안에서 읽힌다.
#
# **2x2 격자다.** 처음에는 `m06_l1` 과 `m08_l6` 두 쌍만 봤는데, 그 둘은 모델도
# 손실도 동시에 다른 **대각선**이라 두 요인이 완전히 교란돼 있었다(F-38). 네
# 칸을 다 채워야 «강한 모델이 더 손해 본다» 가 모델 탓인지 손실(L6) 탓인지
# 갈린다.
#
#            L1                    L6
#   m06   M06L1 / M06L1n      M06L6 / M06L6n
#   m08   M08L1 / M08L1n      M08L6 / M08L6n
dl_methods:
  M06L1:  {ckpt: "results/{tag}/m06_l1/best.pt"}       # FE 판 (frontend=true)
  M06L1n: {ckpt: "results/{tag}/m06_l1_nofe/best.pt"}  # FE 없는 판 (입력이 날것)
  M06L6:  {ckpt: "results/{tag}/m06_l6/best.pt"}
  M06L6n: {ckpt: "results/{tag}/m06_l6_nofe/best.pt"}
  M08L1:  {ckpt: "results/{tag}/m08_l1/best.pt"}
  M08L1n: {ckpt: "results/{tag}/m08_l1_nofe/best.pt"}
  M08L6:  {ckpt: "results/{tag}/m08_l6/best.pt"}
  M08L6n: {ckpt: "results/{tag}/m08_l6_nofe/best.pt"}

eval:
  do_morph: true
  do_spectral: true

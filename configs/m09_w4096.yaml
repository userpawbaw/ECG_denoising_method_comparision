exp_id: m09_w4096
seed: 0

model:
  name: cnn_transformer
  kwargs: {}

loss: L1

data:
  source: auto            # auto = MIT-BIH 가 있으면 그것, 없으면 합성
  dur_s: 300.0            # 합성 소스일 때 기록 길이
  n_train: 18
  n_val: 4
  n_test: 22
  win: 4096            # 16.4 s @ 250 Hz (기본 1024 = 4.096 s)
  hop: 2048            # 겹침 50 % 유지
  snr_range: [-5.0, 20.0]
  max_per_record: 40      # 160 * 1024 / 4096 — 총 샘플 수를 맞춘다
  nstdb_root: data/raw/nstdb
  frontend: true          # 공통 front-end 를 딥러닝에도 동일 적용
                          # (끄면 DL 만 기저선 제거를 처음부터 학습해야 해 불공정)

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 16          # 64 * 1024 / 4096 — step 당 샘플 수를 맞춘다
  epochs: 60
  warmup_frac: 0.05
  patience: 12
  grad_clip: 1.0

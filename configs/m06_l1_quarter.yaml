exp_id: m06_l1_quarter
seed: 0

model:
  name: resunet1d
  kwargs: {chs: [12,16,24,32,48]}   # D-23 B: 약 245 K params

loss: L1

data:
  source: auto            # auto = MIT-BIH 가 있으면 그것, 없으면 합성
  dur_s: 300.0            # 합성 소스일 때 기록 길이
  n_train: 18
  n_val: 4
  n_test: 22
  win: 1024
  hop: 512
  snr_range: [-5.0, 20.0]
  max_per_record: 160     # 에폭당 window 수 상한 (계산량 조절)
  nstdb_root: data/raw/nstdb
  frontend: true          # 공통 front-end 를 딥러닝에도 동일 적용
                          # (끄면 DL 만 기저선 제거를 처음부터 학습해야 해 불공정)

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 64
  epochs: 60
  warmup_frac: 0.05
  patience: 12
  grad_clip: 1.0

# D-23 (B) — 용량 축소 대조. 「용량이 병목인가」를 키우는 대신 줄여서 묻는다.
# 주 결과표에 넣지 않는다 (공정성 규약 4.2).

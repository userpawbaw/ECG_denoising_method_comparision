# EXP-C — distortion floor (RQ3). 잡음 없는 clean 을 그대로 통과시킨다.
exp_id: exp_c
frontend: true          # false 로 두면 FE 를 끌 수 있는 모든 방법에서 끈다
mode: distortion

data:
  source: auto
  split: test
  seg_s: 60.0
  n_seg_per_record: 2
  snr_grid: [-5, 0, 5, 10, 15, 20]
  conditions: [mixed]
  noise_split: test
  dur_s: 300.0
  n_test: 22
  seed: eval_c

# M_FE 는 '공통 front-end 만' 이다. 모든 표에 필수로 넣어
# 각 이득 중 얼마가 front-end 에서 온 것인지 바로 읽히게 한다.
# M04np 는 M04 에서 QRS 보호만 끈 ablation.
methods: [M00, M_FE, M01, M02, M03, M04, M04np, M05f, M05, B01, B02]

dl_methods:
  M06: {ckpt: "results/{tag}/m06_l1/best.pt"}
  M07: {ckpt: "results/{tag}/m07_l1/best.pt", pre: M04}
  M08: {ckpt: "results/{tag}/m08_l1/best.pt"}
  M10: {ckpt: "results/{tag}/m10_l1/best.pt"}
  M09: {ckpt: "results/{tag}/m09_l1/best.pt"}
  # 손실 변형. **L6 의 기제 확인 도구가 바로 이 실험이다** — "깨끗한 입력을
  # 건드리지 마라" 를 손실에 넣었으니, 여기서 출력 SNR 이 올라가야 한다.
  # 이것 없이 abl_loss 의 이득만 보면 왜 좋아졌는지 말할 수 없다.
  M06-L3: {ckpt: "results/{tag}/m06_l3/best.pt"}
  M06-L5: {ckpt: "results/{tag}/m06_l5/best.pt"}
  M06-L6: {ckpt: "results/{tag}/m06_l6/best.pt"}
  M08-L3: {ckpt: "results/{tag}/m08_l3/best.pt"}
  M08-L5: {ckpt: "results/{tag}/m08_l5/best.pt"}
  M08-L6: {ckpt: "results/{tag}/m08_l6/best.pt"}

eval:
  do_morph: true
  do_spectral: true

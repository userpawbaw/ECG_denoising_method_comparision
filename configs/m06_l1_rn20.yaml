# D-39 E2′: full 폭, D0 기록에 20 dB 고정 잡음 (참조·입력 양쪽). --source synthetic 전용
exp_id: m06_l1_rn20
seed: 0
model:
  name: resunet1d
  kwargs: {}
loss: L1
data:
  source: auto
  dur_s: 300.0
  n_train: 18
  n_val: 4
  n_test: 22
  win: 1024
  hop: 512
  snr_range:
  - -5.0
  - 20.0
  max_per_record: 160
  nstdb_root: data/raw/nstdb
  frontend: true
  ref_noise_snr: 20.0
train:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 60
  warmup_frac: 0.05
  patience: 12
  grad_clip: 1.0

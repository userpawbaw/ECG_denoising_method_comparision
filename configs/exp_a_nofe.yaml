# EXP-A-nofe — 부록 조건: 공통 front-end 를 끄고 '알고리즘 자체' 만 비교한다.
# 주 결과는 exp_a(FE=on) 이다 — 실측 장비에서는 front-end 를 당연히 쓰기 때문.
exp_id: exp_a_nofe
frontend: false          # false 로 두면 FE 를 끌 수 있는 모든 방법에서 끈다
mode: snr

data:
  source: auto
  split: test
  seg_s: 60.0
  n_seg_per_record: 2
  snr_grid: [-5, 0, 5, 10, 15, 20]
  conditions: [mixed]
  noise_split: test
  dur_s: 300.0
  n_test: 22
  seed: eval_a

# M_FE 는 '공통 front-end 만' 이다. 모든 표에 필수로 넣어
# 각 이득 중 얼마가 front-end 에서 온 것인지 바로 읽히게 한다.
# M04np 는 M04 에서 QRS 보호만 끈 ablation.
methods: [M00, M_FE, M01, M02, M03, M04, M04np, M05f, M05, B01, B02]

dl_methods: {}   # FE 없이 학습한 체크포인트가 없으므로 DL 은 제외

eval:
  do_morph: true
  do_spectral: true

# D-30 2′ ② — **공통 평가 세트**로 seed 쌍을 잰다. seed 4·5 몫.
#
# ## 왜 sweep 의 지표를 안 쓰나 (O-32)
#
# `run_seed_sweep.py` 의 `fixed_snr_imp_scaled` 는 **그 arm 이 받은 입력** 대비
# 개선이다. FE 판의 입력은 `FE(x_raw + 잡음)`, nofe 판은 `x_raw + 잡음` 이라
# **분모가 다르다** — 실측으로 `fixed_snr_in` 이 +15.50 대 +7.50, 8 dB 차다.
# 그대로 빼면 F-10 을 재현한다. F-41 의 「고정 평가」가 고정한 것은 **잡음
# 뽑기**이지 입력의 정의가 아니다.
#
# 여기서는 `exp_nofe.yaml` 과 **똑같은 평가 세트**를 쓴다:
#
#   y (입력)  = x_raw + 잡음        <- 두 방식이 같은 것을 받는다
#   x (참조)  = FE_off(x_raw)        <- 두 방식이 같은 것과 비교된다
#
# FE 는 방법 **안쪽**에 있다. 그래서 분모가 같고 뺄셈이 성립한다.
#
# ## 왜 둘로 나눠 돌리나
#
# sweep 체크포인트는 `.gitignore:102`(`results/ext/**/best.pt`)가 **일부러
# 무시**한다 — 이 컨테이너 디스크에만 있다. 8 판을 다 기다렸다 한 번에 재면
# 컨테이너가 사라질 때 5 시간이 통째로 날아간다. **parquet 은 추적되므로**
# (`!results/**/*.parquet`) 쌍이 끝나는 대로 재서 진행을 보존한다.
# 나머지는 `exp_nofe_d1_s67.yaml` 이 맡는다.
exp_id: exp_nofe_d1_s45

side_experiment:
  train: bash scripts/run_sweep_locked.sh --arms m06_l1,m06_l1_nofe 4-7 --out results/ext/nofe_d1 --keep-ckpt
frontend: true
mode: snr

data:
  source: auto
  split: test
  seg_s: 60.0
  n_seg_per_record: 2
  snr_grid: [-5, 0, 5, 10, 15, 20]
  conditions: [mixed]
  noise_split: test
  dur_s: 300.0
  n_test: 22
  seed: eval_a            # EXP-A · exp_nofe 와 **같은 세트**

methods: [M00, M_FE]      # 바닥선과 «FE 만»

# **쌍으로 넣는다** — 같은 seed 의 FE 판과 nofe 판이 나란히 있어야 그 안에서
# 「FE 를 뺀 대가」가 읽힌다. seed 가 짝짓기의 단위다.
#
# **`frontend` 를 여기 적는다.** sweep 체크포인트에는 그 기록이 없다
# (`run_seed_sweep.py` 가 `Trainer` 를 직접 써서 `scripts/train.py` 의 기록
# 줄을 안 거쳤다 — 고쳤지만 이미 학습된 판에는 없다). 없으면 `run_exp.py` 가
# 멈춘다 — 예전에는 `False` 로 **추측**했고, 그러면 **FE 판이 nofe 로 평가돼**
# 「FE 를 빼도 손해가 작다」는 틀린 결론이 조용히 나온다 (O-33).
#
# 적어 두면 **설정 파일만 봐도 실험 조건이 읽힌다** — 체크포인트를 열어 볼
# 필요가 없다. 그쪽이 더 낫다.
dl_methods:
  S4:  {ckpt: "results/ext/nofe_d1/m06_l1__s4/best.pt",       frontend: true}
  S4n: {ckpt: "results/ext/nofe_d1/m06_l1_nofe__s4/best.pt",  frontend: false}
  S5:  {ckpt: "results/ext/nofe_d1/m06_l1__s5/best.pt",       frontend: true}
  S5n: {ckpt: "results/ext/nofe_d1/m06_l1_nofe__s5/best.pt",  frontend: false}

eval:
  do_morph: true
  do_spectral: true

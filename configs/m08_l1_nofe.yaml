# `m08_l1` 의 **FE 없는 판** — 2x2 격자를 채우는 칸이다.
#
# **왜 필요한가.** F-38 은 `m06_l1` 쌍과 `m08_l6` 쌍을 비교해 «강한 모델이 더
# 손해 본다» 를 얻었는데, 그 둘은 **모델도 손실도 동시에 다르다** — 격자의
# 대각선 두 칸이라 두 요인이 **완전히 교란**돼 있다. 원인을 L6 로 지목한 것은
# `[코드]` 근거(손실 정의)일 뿐 측정이 아니다.
#
# | | L1 | L6 |
# |---|---|---|
# | `m06` (resunet1d) | 격차 +3.80 dB | **이 파일 / `m06_l6_nofe`** |
# | `m08` (wavelet_unet) | **이 파일 / `m08_l1_nofe`** | 격차 +5.98 dB |
#
# 나머지 두 칸을 채우면 갈린다:
#   `m08_l1` 격차가 작다  -> 원인은 **손실(L6)**
#   `m06_l6` 격차가 크다  -> 같은 결론의 독립 확인
#   둘 다 중간            -> 모델과 손실이 둘 다 기여
#
# **이 체크포인트는 EXP-A~G 의 표에 넣지 않는다** — 공정성 규약 4.2 를 일부러
# 깨는 조건이다.
exp_id: m08_l1_nofe
seed: 0

model:
  name: wavelet_unet
  kwargs: {}

loss: L1

data:
  source: auto            # auto = MIT-BIH 가 있으면 그것, 없으면 합성
  dur_s: 300.0            # 합성 소스일 때 기록 길이
  n_train: 18
  n_val: 4
  n_test: 22
  win: 1024
  hop: 512
  snr_range: [-5.0, 20.0]
  max_per_record: 160     # 에폭당 window 수 상한 (계산량 조절)
  nstdb_root: data/raw/nstdb
  # ---- 이 설정의 전부: **입력만 날것으로 준다** (docs/15 §7 목적 B)
  frontend: false         # 입력에 FE 를 안 건다 — 모델이 앞단까지 스스로 배운다
  ref_frontend: true      # **목표는 FE 를 통과한 것 그대로 둔다.**
                          # false 로 하면 D1 의 목표가 «MIT-BIH 원본» 이 되고,
                          # 그것은 clean 이 아니다 — 모델이 기록 자신의 잡음을
                          # 재현하도록 학습된다 (F-12 재현).

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 64
  epochs: 60
  warmup_frac: 0.05
  patience: 12
  grad_clip: 1.0

# m08_l6 의 **FE 없는 판** — `m06_l1_nofe` 와 같은 조건, 다른 모델·손실.
#
# **왜 두 번째를 하는가.** F-34 는 «FE 없는 판이 전 동작점에서 진다» 를
# `m06`(resunet1d) + `L1` **한 조합**에서만 봤다. 그 결론이 그 조합에만 국한된
# 것인지, 일반적인 것인지는 축을 바꿔 봐야 안다. `m08_l6` 은 **모델도 손실도
# 다르고**(wavelet_unet + L6), D1 에서 더 강하다(best VAL +4.610 대 +3.437).
#
# **예측을 적어 둔다** (F-37 에서 배운 대로 — 안 적으면 무엇이 틀렸는지 모른다):
# F-34 의 설명이 «같은 용량으로 대역제한+노치+잡음제거를 한꺼번에 하느라
# 파형 재현이 나빠진다» 였으므로, **더 강한 모델은 덜 손해 봐야 한다.**
# 즉 `m08_l6` 의 FE 판 대 nofe 판 격차가 `m06_l1` 의 +1.5~+3.8 dB 보다
# **작아야** 한다. 그렇지 않으면 F-34 의 기제 설명을 다시 봐야 한다.
#
# **이 체크포인트는 EXP-A~G 의 표에 넣지 않는다** — 공정성 규약 4.2 의 «모든
# 방법이 같은 입력에서 출발한다» 를 일부러 깨는 조건이다.
exp_id: m08_l6_nofe
seed: 0

model:
  name: wavelet_unet
  kwargs: {}

loss: L6

data:
  source: auto            # auto = MIT-BIH 가 있으면 그것, 없으면 합성
  dur_s: 300.0            # 합성 소스일 때 기록 길이
  n_train: 18
  n_val: 4
  n_test: 22
  win: 1024
  hop: 512
  snr_range: [-5.0, 20.0]
  max_per_record: 160     # 에폭당 window 수 상한 (계산량 조절)
  nstdb_root: data/raw/nstdb
  # ---- 이 설정의 전부: **입력만 날것으로 준다** (docs/15 §7 목적 B)
  frontend: false         # 입력에 FE 를 안 건다 — 모델이 앞단까지 스스로 배운다
  ref_frontend: true      # **목표는 FE 를 통과한 것 그대로 둔다.**
                          # false 로 하면 D1 의 목표가 «MIT-BIH 원본» 이 되고,
                          # 그것은 clean 이 아니다 — 모델이 기록 자신의 잡음을
                          # 재현하도록 학습된다 (F-12 재현). 묻는 것은 «앞단을
                          # 스스로 배울 수 있는가» 이지 «참조를 바꾸면 어떻게
                          # 되는가» 가 아니다.

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 64
  epochs: 60
  warmup_frac: 0.05
  patience: 12
  grad_clip: 1.0

# STEP 19 — loss ablation. RQ 는 "손실 항이 morphology 를 실제로 바꾸는가" 다.
#
# 주의: 이 비교가 성립하려면 **손실 외의 모든 조건이 같아야** 한다.
# 특히 front-end 유무가 섞이면 loss 효과와 FE 효과를 분리할 수 없다 (F-9).
# 따라서 여기 실리는 체크포인트는 전부 frontend: true 로 재학습된 것이어야 한다.
exp_id: abl_loss
frontend: true
mode: snr

data:
  source: auto
  split: test
  seg_s: 60.0
  n_seg_per_record: 2
  # loss 효과는 SNR 전 구간에서 같은 방향이 아닐 수 있어 저/중/고를 모두 본다.
  snr_grid: [0, 10, 20]
  conditions: [mixed]
  noise_split: test
  dur_s: 300.0
  n_test: 22
  seed: eval_abl

# M_FE 를 기준선으로 둔다. loss 간 차이가 front-end 가 이미 한 일보다
# 큰지 작은지를 같은 표에서 바로 읽기 위해서다.
methods: [M_FE]

dl_methods:
  M06-L1: {ckpt: "results/{tag}/m06_l1/best.pt"}
  M06-L2: {ckpt: "results/{tag}/m06_l2/best.pt"}
  M06-L3: {ckpt: "results/{tag}/m06_l3/best.pt"}
  M08-L1: {ckpt: "results/{tag}/m08_l1/best.pt"}
  M08-L3: {ckpt: "results/{tag}/m08_l3/best.pt"}
  M08-L4: {ckpt: "results/{tag}/m08_l4/best.pt"}

eval:
  do_morph: true          # qrs_dur_err_ms, beat_cc 가 DoD 지표다
  do_spectral: false

frontend: true          # false 로 두면 FE 를 끌 수 있는 모든 방법에서 끈다
snr_db: 5.0

data:
  source: auto
  seg_s: 60.0
  n_seg_per_record: 1
  dur_s: 300.0
  n_test: 22

[pytest]
testpaths = tests
markers =
    slow: 실제 학습을 돌려 몇 분 걸린다. 기본 실행에서 빠진다

# **기본 실행에서 `slow` 를 뺀다.** `pytest tests/` 는 커밋 직전에 매번 도는
# 검사라 1 분 안에 끝나야 한다. 학습을 실제로 돌려 재개를 확인하는 검사
# (`test_sweep_resume.py`)는 몇 분이 걸리므로 명시할 때만 돌린다:
#
#     pytest tests/ -m slow        # 느린 것만
#     pytest tests/ -m ""          # 전부
addopts = -m "not slow"

[pytest]
testpaths = tests
markers =
    slow: 실제 학습을 돌려 몇 분 걸린다. 기본 실행에서 빠진다
    screens: 브라우저로 시연 화면을 열어 본다. 화면을 고쳤으면 돌린다

# **기본 실행에서 `slow` 를 뺀다.** `pytest tests/` 는 커밋 직전에 매번 도는
# 검사라 1 분 안에 끝나야 한다. 학습을 실제로 돌려 재개를 확인하는 검사
# (`test_sweep_resume.py`)는 몇 분이 걸리므로 명시할 때만 돌린다:
#
#     pytest tests/ -m slow        # 느린 것만
#     pytest tests/ -m screens     # 화면 검사만 (브라우저를 띄운다)
#     pytest tests/ -m ""          # 전부
#
# `screens` 를 뺀 이유도 같다 — 브라우저를 띄우고 8.6 MB 은행을 파싱하므로
# 화면당 몇 초가 든다. **화면을 고쳤으면 반드시 돌린다**(docs/17_checklists.md).
addopts = -m "not slow and not screens"

<!doctype html>
<meta charset="utf-8">
<title>C3 · B안 — 실험 노트</title>
<!--
  ┌ 주제의식 ────────────────────────────────────────────────────────────┐
  │ **심사위원에게 근거를 보이는 것.** 이 안의 목표는 임팩트가 아니라     │
  │ 신뢰다. 화면의 모든 수치 옆에 그것이 어디서 나왔는지가 함께 있고,    │
  │ 색은 절제하며, 배경은 ECG 모눈종이다. 인쇄해도 그대로 읽힌다.        │
  │                                                                      │
  │ 애니메이션은 **최소**다 — 잡음을 바꿀 때 크로스페이드, 그리고 잡음이 │
  │ 사는 대역 띠가 미끄러져 이동하는 것뿐. 움직임 자체가 주장이 아니다.  │
  │ 대신 호버 십자선으로 **한 주파수를 집어 값을 읽을 수 있다.**         │
  └──────────────────────────────────────────────────────────────────────┘
  팔레트는 라이트 서피스(#fffdfa)에서 all-pairs PASS (blue·orange·aqua).
-->
<style>
  :root{
    --paper:#fffdfa; --grid:#f3dcdc; --grid2:#ecc9c9;
    --ink:#1a1a18; --mute:#6c6a63; --rule:#e2ded4;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
    --clean:#b8b6ae; --input:#d8d5cc; --mark:#b03030;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#f6f4ef;color:var(--ink);
    font:14px/1.6 "Nanum Gothic",-apple-system,"Segoe UI",sans-serif}
  .sheet{max-width:1120px;margin:26px auto;background:var(--paper);
    border:1px solid var(--rule);border-radius:2px;
    box-shadow:0 1px 0 #fff inset,0 8px 24px -18px #000;padding:30px 34px 34px}
  header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--mute);margin-bottom:6px}
  h1{margin:0;font-size:23px;letter-spacing:-.02em;font-weight:700}
  h1 em{font-style:normal;border-bottom:3px solid var(--s2);padding-bottom:1px}
  .lede{margin:9px 0 0;color:var(--mute);font-size:13px;max-width:70ch}
  .pick{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px;align-items:center}
  .pick>span{font-size:11px;color:var(--mute);letter-spacing:.06em;margin-right:4px}
  button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--rule);
    background:#fff;color:var(--ink);cursor:pointer;border-radius:2px}
  button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px}
  @media(max-width:880px){.cols{grid-template-columns:1fr}}
  figure{margin:0}
  figcaption{font-size:12px;color:var(--mute);margin:0 0 6px;
    display:flex;justify-content:space-between;align-items:baseline}
  figcaption b{color:var(--ink);font-size:12.5px}
  .plot{position:relative}
  canvas{width:100%;display:block;border:1px solid var(--rule)}
  #wave{height:236px;background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:10px 10px}
  #spec{height:236px;background:#fff}
  .hint{position:absolute;pointer-events:none;background:#1a1a18;color:#fff;
    font:11px/1.4 ui-monospace,monospace;padding:5px 7px;border-radius:3px;
    white-space:pre;opacity:0;transition:opacity .1s}
  table{border-collapse:collapse;width:100%;margin-top:18px;font-size:12.5px}
  th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--rule)}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.03em}
  td b{font-variant-numeric:tabular-nums}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
  .note{margin-top:16px;padding:11px 13px;background:#fbf7ef;
    border-left:3px solid var(--s2);font-size:13px}
  .src{margin-top:12px;font-size:11px;color:var(--mute)}
</style>

<div class="sheet">
  <header>
    <div class="eyebrow">지표 카드 ③ · psd_logdist</div>
    <h1>SNR 은 상위권인데 <em>스펙트럼은 최악</em>이다</h1>
    <p class="lede">같은 신호를 왼쪽은 시간축으로, 오른쪽은 주파수축으로 본다.
      선의 색은 양쪽에서 같다. <b>SNR 한 숫자로는 «어느 대역을 지웠는가» 를 물을 수 없다.</b></p>
  </header>

  <div class="pick" id="pick"><span>주입 잡음</span></div>

  <div class="cols">
    <figure>
      <figcaption><b>시간축</b><span id="w-meta">—</span></figcaption>
      <div class="plot"><canvas id="wave"></canvas></div>
    </figure>
    <figure>
      <figcaption><b>스펙트럼 · dB (참값 최대 = 0)</b><span id="s-meta">—</span></figcaption>
      <div class="plot"><canvas id="spec"></canvas><div class="hint" id="hint"></div></div>
    </figure>
  </div>

  <table>
    <thead><tr><th>방법</th><th>잡음 대역 억제</th><th>ECG 대역(0.5–40 Hz) 변화</th>
      <th>psd_logdist</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>

  <div class="note" id="note"></div>
  <p class="src" id="src">—</p>
</div>

<script src="../card_bank.js"></script>
<script type="module">
import {B, SCENE, trace, psd, SHOW, LABEL, HZ, fit, mapper, line, bandOf, animate,
        logdist, bandDb} from "./card_core.js";

const RGB = {M01:"#2a78d6", M04:"#eb6834", M08:"#1baf7a"};
let cond = "pli", fade = 1, hoverF = null;

const pick = document.getElementById("pick");
B.conds.forEach(c => {
  const b = document.createElement("button");
  b.textContent = B.cond_label[c]; b.dataset.c = c;
  b.setAttribute("aria-pressed", String(c === cond));
  b.onclick = () => { if (c === cond) return; cond = c;
    [...pick.querySelectorAll("button")].forEach(n =>
      n.setAttribute("aria-pressed", String(n.dataset.c === c)));
    fade = 0; animate(340, t => { fade = t; draw(); }); update(); };
  pick.appendChild(b);
});

const PS = {l:38, r:10, t:10, b:26};
const fx = (f, w) => PS.l + (f / 100) * (w - PS.l - PS.r);

function draw() {
  { const {g, w, h} = fit(document.getElementById("wave"));
    g.globalAlpha = 0.35 + 0.65 * fade;
    const keys = ["input", "clean", ...SHOW];
    const a = Object.fromEntries(keys.map(k => [k, trace(cond, k)]));
    let m = 0; for (const k of keys) for (const v of a[k]) m = Math.max(m, Math.abs(v));
    const M = mapper(w, h, a.clean.length, -m * 1.06, m * 1.06, {l:4,r:4,t:6,b:6});
    line(g, M.x, M.y, a.input, "#d8d5cc", 1);
    line(g, M.x, M.y, a.clean, "#b8b6ae", 2.4);
    for (const k of SHOW) line(g, M.x, M.y, a[k], RGB[k], 1.4);
    g.globalAlpha = 1;
    document.getElementById("w-meta").textContent = `${(B.n / B.fs).toFixed(0)} s`;
  }
  { const {g, w, h} = fit(document.getElementById("spec"));
    const a = Object.fromEntries(["input","clean",...SHOW].map(k => [k, psd(cond, k)]));
    const M = mapper(w, h, HZ.length, -62, 12, PS);
    const [b0, b1] = bandOf(cond);
    // 잡음이 사는 대역 — 폭이 잡음마다 달라 **띠가 미끄러진다.**
    g.fillStyle = "rgba(176,48,48,.09)";
    g.fillRect(fx(b0, w), PS.t, Math.max(3, fx(Math.min(b1,100), w) - fx(b0, w)), h - PS.t - PS.b);
    g.strokeStyle = "#efece4"; g.lineWidth = 1;
    g.fillStyle = "#6c6a63"; g.font = "10px ui-monospace,monospace";
    for (const f of [0,20,40,60,80,100]) {
      g.beginPath(); g.moveTo(fx(f,w), PS.t); g.lineTo(fx(f,w), h-PS.b); g.stroke();
      g.fillText(String(f), fx(f,w)-5, h-9); }
    for (const d of [0,-20,-40,-60]) {
      g.beginPath(); g.moveTo(PS.l, M.y(d)); g.lineTo(w-PS.r, M.y(d)); g.stroke();
      g.fillText(String(d), 10, M.y(d)+3); }
    g.fillText("Hz", w-PS.r-40, h-9);
    g.globalAlpha = 0.35 + 0.65 * fade;
    const X = i => fx(HZ[i], w);
    line(g, X, M.y, a.input, "#d8d5cc", 1.3);
    line(g, X, M.y, a.clean, "#b8b6ae", 2.2);
    for (const k of SHOW) line(g, X, M.y, a[k], RGB[k], 1.4);
    g.globalAlpha = 1;
    g.font = "600 10.5px ui-monospace,monospace"; g.textAlign = "right";
    for (const k of SHOW) { g.fillStyle = RGB[k];
      g.fillText(k, w - PS.r - 2, M.y(a[k][a[k].length-1]) - 4); }
    g.textAlign = "left";
    if (hoverF != null) {                       // 십자선 — 한 주파수를 집어 읽는다
      const px = fx(hoverF, w);
      g.strokeStyle = "#1a1a18"; g.setLineDash([3,3]);
      g.beginPath(); g.moveTo(px, PS.t); g.lineTo(px, h-PS.b); g.stroke();
      g.setLineDash([]);
    }
    document.getElementById("s-meta").textContent = `잡음 대역 ${b0}–${Math.min(b1,125)} Hz`;
  }
}

const spec = document.getElementById("spec"), hint = document.getElementById("hint");
spec.onmousemove = e => {
  const r = spec.getBoundingClientRect(), w = r.width;
  const f = ((e.clientX - r.left) - PS.l) / (w - PS.l - PS.r) * 100;
  if (f < 0 || f > 100) { spec.onmouseleave(); return; }
  hoverF = f;
  const i = HZ.reduce((b, v, k) => Math.abs(v - f) < Math.abs(HZ[b] - f) ? k : b, 0);
  hint.style.opacity = 1;
  hint.style.left = Math.min(w - 150, e.clientX - r.left + 12) + "px";
  hint.style.top = (e.clientY - r.top - 8) + "px";
  hint.textContent = `${HZ[i].toFixed(1)} Hz\n입력  ${psd(cond,"input")[i].toFixed(1)} dB\n참값  ${psd(cond,"clean")[i].toFixed(1)} dB\n` +
    SHOW.map(m => `${m}   ${psd(cond,m)[i].toFixed(1)} dB`).join("\n");
  draw();
};
spec.onmouseleave = () => { hoverF = null; hint.style.opacity = 0; draw(); };

function update() {
  const s = SCENE[cond], [b0, b1] = bandOf(cond);
  const pin = psd(cond,"input"), pc = psd(cond,"clean");
  document.getElementById("tb").innerHTML = SHOW.map(m => {
    const p = psd(cond, m);
    const kill = bandDb(pin,b0,b1) - bandDb(p,b0,b1);
    const keep = bandDb(p,0.5,40) - bandDb(pc,0.5,40);
    const d = logdist(p, pc);       // 이 구간의 값이다 (축 평균이 아니다)
    return `<tr><td><span class="sw" style="background:${RGB[m]}"></span>${LABEL[m]}</td>
      <td><b>−${kill.toFixed(1)} dB</b></td>
      <td><b>${keep>=0?"+":"−"}${Math.abs(keep).toFixed(1)} dB</b></td>
      <td><b>${d.toFixed(2)}</b></td></tr>`;
  }).join("");
  document.getElementById("note").innerHTML = cond === "pli"
    ? "<b>60 Hz 봉우리 하나가 사라진다 — 그런데 M01 은 그 위 대역을 통째로 데려갔다.</b> 오른쪽에서 40 Hz 뒤로 주저앉는 파란 선이 그것이다. 시간축만 보면 M01 이 가장 깨끗해 보이고, SNR 도 그렇게 센다."
    : `<b>${B.cond_label[cond]}</b> 은 붉은 띠 대역에 산다. 억제량(가운데 열)만 보면 많이 지운 방법이 이기지만, <b>오른쪽 열(ECG 대역 변화)이 0 에서 멀어지면 신호를 함께 지운 것</b>이다. 두 열을 같이 읽어야 한다.`;
  document.getElementById("src").textContent =
    `근거: ${B.axis} 기록 ${s.record} · 입력 SNR ${B.snr} dB · 잡음 «${B.cond_label[cond]}» · ` +
    `PSD 는 Welch, 참값 최대를 0 dB 로 정규화. 생성: scripts/build_card_bank.py`;
}

addEventListener("resize", draw);
update(); draw();
</script>
